<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="index.css">
    <title>Document</title>
</head>
<body>
<!-- HEADER CONTENT -->
    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-podcast fa-2xl"></i>
            <strong>PodcastApp</strong>
        </div>
        <div class="header_icons">
            <i class="fa-solid fa-magnifying-glass fa-2xl"></i>
            <i class="fa-regular fa-circle-user fa-2xl"></i>
        </div>
    </header>
    <!-- MAIN CONTENT -->
   <main class="main_content">
    <!-- GENRE & UPDATED CONTENT DROPDOWN -->
    <div class="filter_content_box">
        <label for="all_genre">Filter by:</label>

        <!-- GENRE -->
        <select name="" id="all_genre">
            <option value="">All Genres</option>
            <option value="1">Genre 1</option>
            <option value="2">Genre 2</option>
            <option value="3">Genre 3</option>
            <option value="4">Genre 4</option>
        </select>

        <!-- UPDATED CONTENT -->
        <select name="" id="timeline_option">
            <option value="">Recently Updated</option>
            <option value="1">Most Popular</option>
            <option value="2">Recent</option>
        </select>
    </div>

    <!-- JavaScript will add <podcast-card> elements here -->
    <div class="main_podcast_data_container"></div>
</main>
     <!--PODCAST MODAL-->
<div class="podcast_modal_overlay hidden">

    <div class="podcast_modal">
        <header class="modal_header">
        <!-- MODAL TITLE -->
           <h2 class="modal_title"></h2>
        <!-- CLOSE BUTTON -->
        <button class="modal_close_btn">
            <i class="fa-solid fa-xmark"></i>
        </button>
        </header>
        <div class="modal_flex_container">
        <!-- MODAL IMAGE -->
        <div class="modal_img_container">
            <img src="" alt="" class="modal_img">
        </div>

        <!-- MODAL CONTENT -->
        <div class="modal_content">
           <div class="modal_content_description">
            <h3>Description</h3>

            <p class="modal_description"></p>
            </div>
            <!-- MODAL GENRES -->
            <div class="modal_genres"></div>

        </div>
    </div>
    <!-- MODAL SEASONS -->
    <div class="modal_seasons_container">

        <h3>Seasons</h3>

        <div class="modal_seasons_list"></div>

    </div>

    </div>

</div>

    <script type="module" src="./init.js"></script>
</body>
</html>
